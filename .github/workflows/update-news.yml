name: Review news pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate candidate news
        run: python scripts/update_news.py
      - name: Create review branch
        id: review
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="pipeline-preview-${RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git switch -c "$BRANCH"
          git config user.name "viral-news-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes detected; no review PR is needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: prepare news pipeline review"
          git push origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open review pull request
        if: steps.review.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.review.outputs.branch }}
        run: |
          gh pr create             --base main             --head "$BRANCH"             --title "Review generated news: $(date -u +%F)"             --body "Automated candidate news generated by the Review news pipeline. Please review the Top 10, summaries, source links, and timeline changes before merging. The live website updates only after this PR is merged into main."
