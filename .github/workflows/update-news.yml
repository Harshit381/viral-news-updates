name: Update news data
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "30 2 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update free RSS data
        run: python scripts/update_news.py
      - name: Commit daily snapshot
        run: |
          git config user.name "viral-news-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update daily news"
          git push
