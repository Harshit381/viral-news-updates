name: Review news pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate candidate news
        run: python scripts/update_news.py
      - name: Create review branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="pipeline-preview-${RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name "viral-news-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi
          git commit -m "chore: prepare news pipeline review"
          git push origin "$BRANCH"
          echo "Review branch pushed: $BRANCH"
