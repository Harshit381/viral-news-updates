name: Update news data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update RSS data
        run: python scripts/update_news.py
      - name: Commit updated data
        run: |
          git config user.name "viral-news-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/issues.json
          git diff --cached --quiet || git commit -m "chore: update news data"
          git push
