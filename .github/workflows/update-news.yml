name: Viral News Pipeline
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Choose one pipeline stage to run"
        required: true
        type: choice
        default: full
        options:
          - full
          - collect_cluster
          - build_vector_index
          - validate
          - prepare_review
  schedule:
    - cron: "30 2 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - ".github/workflows/update-news.yml"
concurrency:
  group: news-pipeline
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Explain selected stage
        env:
          STAGE: ${{ inputs.stage || 'full' }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Selected stage: $STAGE"
          echo "Trigger: $EVENT"
          echo "No paid API, database, or AI service is used."
      - name: 1. Collect, normalize, cluster and rank public RSS news
        if: (github.event_name == 'schedule' || github.event_name == 'push') || inputs.stage == 'full' || inputs.stage == 'collect_cluster'
        run: python scripts/update_news.py
      - name: 2. Build local sparse vector index for RAG retrieval
        if: github.event_name == 'schedule' || inputs.stage == 'full' || inputs.stage == 'build_vector_index' || inputs.stage == 'prepare_review'
        run: python scripts/rag_index.py
      - name: 3. Validate generated news and vector index
        if: github.event_name == 'schedule' || inputs.stage == 'full' || inputs.stage == 'validate' || inputs.stage == 'prepare_review'
        run: python scripts/validate_pipeline.py
      - name: 4. Create review branch and push candidate data
        id: review
        if: github.event_name == 'schedule' || inputs.stage == 'full' || inputs.stage == 'collect_cluster' || inputs.stage == 'build_vector_index' || inputs.stage == 'prepare_review'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="pipeline-preview-${RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git switch -c "$BRANCH"
          git config user.name "viral-news-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes detected. Validation still completed."
            exit 0
          fi
          git commit -m "chore: prepare news pipeline candidate"
          git push origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: 5. Open review pull request (fallback if repository setting blocks it)
        if: ((github.event_name == 'schedule' || github.event_name == 'push') || inputs.stage == 'full' || inputs.stage == 'prepare_review' || inputs.stage == 'collect_cluster' || inputs.stage == 'build_vector_index') && steps.review.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.review.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          gh pr create --base main --head "$BRANCH" \
            --title "Review generated news and RAG index: $(date -u +%F)" \
            --body "Candidate generated by the free Viral News Updates pipeline. Review Top 10, source links, timelines, and data/rag_index.json before merging. The live website changes only after merge."
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::warning::Automatic PR creation is blocked or failed. Candidate branch was pushed."
            echo "Create a PR manually: https://github.com/$REPO/compare/main...$BRANCH?expand=1"
            echo "If error mentions createPullRequest, enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
          fi
          exit 0
      - name: Run summary
        if: always()
        env:
          STAGE: ${{ inputs.stage || 'full' }}
          BRANCH: ${{ steps.review.outputs.branch }}
        run: |
          echo "### Viral News Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stage: $STAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate branch: ${BRANCH:-not created}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cost: $0 tools; standard GitHub free-tier limits apply" >> "$GITHUB_STEP_SUMMARY"
